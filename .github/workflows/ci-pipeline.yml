# .github/workflows/ci-pipeline.yml

name: Task Management CI/CD

on:
  push:
    branches:
      - 'main'
      - 'master'
      - 'BE-**'  # <-- Triggers on pushes to branches like BE-0005, BE-0006, etc.
  pull_request:
    branches: [ "main", "master" ] # Also trigger on PRs to main/master

jobs:
  # =================================================================
  #  1. BUILD, LINT & TEST
  #  This job ensures the code is correct and high-quality.
  # =================================================================
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle' # <-- BEST PRACTICE: Cache Gradle dependencies

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests and build
        # 'build' automatically runs 'test', so you only need one command
        run: ./gradlew build

      - name: Upload test report
        # Always upload reports, even on failure, for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test

  # =================================================================
  #  2. BUILD & PUSH DOCKER IMAGE
  #  This job runs only after 'build_and_test' succeeds on the main branch.
  # =================================================================
  build_and_push_docker_image:
    # This job should only run on the main or BE-0005 branch after a successful push
    if: (github.ref_name == 'main' || github.ref_name == 'BE-0005') && github.event_name == 'push'
    needs: build_and_test # <-- This job depends on the previous one
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # <-- Required to push to GitHub Container Registry

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # <-- GitHub provides this automatically

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # =================================================================
  #  3. DEPLOY TO RENDER
  # =================================================================
  deploy_to_render:
    if: (github.ref_name == 'main' || github.ref_name == 'BE-0005') && github.event_name == 'push'
    needs: build_and_push_docker_image
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: curl "https://api.render.com/deploy/srv-d24a5q15pdvs7383sal0?key=pKKoEYtx2EA"